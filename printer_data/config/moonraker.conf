# managed_services: klipper

# [include moonraker-obico-update.cfg]

[update_manager KlipperScreen]
install_script: /home/mks/KlipperScreen/scripts/KlipperScreen-install.sh
requirements: /home/mks/KlipperScreen/scripts/KlipperScreen-requirements.txt
env: /home/mks/.KlipperScreen-env/bin/python
managed_services: KlipperScreen
origin: https://github.com/KlipperScreen/KlipperScreen.git
path: /home/mks/KlipperScreen
type: git_repo

[update_manager mobileraker]
install_script: /home/mks/mobileraker_companion/scripts/install.sh
requirements: /home/mks/mobileraker_companion/scripts/mobileraker-requirements.txt
env: /home/mks/mobileraker-env/bin/python
managed_services: mobileraker
primary_branch: main
origin: https://github.com/Clon1998/mobileraker_companion.git
path: /home/mks/mobileraker_companion
type: git_repo
[update_manager klipper-backup]
type: git_repo
path: ~/klipper-backup
origin: https://github.com/Staubgeborener/klipper-backup.git
managed_services: moonraker
primary_branch: main

[update_manager mainsail]
path: /home/mks/mainsail
repo: mainsail-crew/mainsail
channel: stable
type: web

[update_manager mainsail-config]
managed_services: klipper
origin: https://github.com/mainsail-crew/mainsail-config.git
path: /home/mks/mainsail-config
primary_branch: master
type: git_repo
